// __TITLE__ · clipping-file commentary (narrated). Hand-written PROMO.compose: every shot is timed from the narration (T.start / T.end / T.word).
// Before the picture: facts with sources in brief.md — including the verbatim excerpts you will show from each source document — then the
// treatment (styles/dossier/STYLE.md). Chapters: give lines a "chapter" in script.json; the runtime draws the bar (compose chapters: false).
// News about markets or companies: add the disclaimer below, never a buy / sell call.
const { M } = PROMO;
PROMO.compose({
  bpm: 100, offset: 0, grain: false, chapters: false, tail: 1.5,
  disclaimer: M('仅为新闻解读，不构成投资建议', 'News commentary only, not investment advice'),
  theme: { bg: '#000', fg: '#fff', ink: '#fff', muted: '#9a9a96', accent: '#fff', paper: '#151515', fonts: { display: '"Noto Sans SC", sans-serif', serif: '"Noto Serif SC", serif', sans: '"Noto Sans SC", sans-serif' } },
  build: (F) => {
    const T = F.T, s = T.start, e = T.end, w = T.word;
    // an invented channel and masthead: never a real outlet's name, logo or masthead
    const R = PROMO.dossier(F, { brand: { name: M('铅字局', 'Leadtype'), en: 'LEADTYPE' }, masthead: 'THE LEADTYPE POST' });

    // l1 · the clipping page: the headline with a highlighter stroke; the lead and the articles are real reporting written from brief.md (printed once, never filler)
    const a1 = 0, b1 = e('l1') + 0.3;
    { const S = R.shot(a1, b1, { bg: 'news' });
      const pg = S.page({ headline: M('标题？', 'Headline?'), mark: true, markAt: s('l1') + 0.3, en: 'ENGLISH SUBHEAD', sub: M('一行副标题', 'One line under it'), photo: 'skyline',
        lead: M('导语：用 brief.md 里的事实写的一段真实导语。', 'Lead: a real lead written from the facts in brief.md.'),
        stories: [{ head: M('小标题', 'Subhead'), text: M('正文：用事实写的真实短讯，每段只印一次（写不满就让栏空着，别重复）。', 'Copy: a real short report from the facts, printed once (leave a column short rather than repeat).') }] });
      S.push({ x: R.FW / 2, y: 480, h: 1000 }, { on: pg.head, pad: 1.6, dy: 120 }, a1, b1); }

    // … one block per line or phrase. The core move: a source document under the masthead, the camera pushing from the whole page into
    //   the one line the narrator quotes, a translation bar / tag / marker landing on those exact words as they are said:
    //   const d = S.doc({ kind: 'release', issuer, title, date, blocks: [{ p: '…verbatim…' }], source: 'Source: … · date' });
    //   S.cam(a, { x: R.FW / 2, y: 520, h: 1300 }); S.cam(w('l2', '收入'), { on: d.find('Revenue was'), pad: 1.2 });
    //   S.translate(d.block(0), '中文译文', { at: w('l2', '收入'), color: 'blue', mode: 'over' });
    //   numbers: S.chart / S.table on paper, S.callout over the picture; the turn: R.title(a, b, { lines: ['…', '…'], art: 'servers' }).

    // the end: the closing sheet with the sources (and picture credits, if any)
    const z = b1;
    R.end(z, F.duration, { sub: M('一句话总结', 'One-line takeaway'), sources: [M('资料来源写在这里（机构 · 日期）', 'Sources here (issuer · date)')] });

    F.section(0, 1, { name: 'open' });
    F.section(z, 1, { name: 'close' });
  },
});
</script></body></html>
