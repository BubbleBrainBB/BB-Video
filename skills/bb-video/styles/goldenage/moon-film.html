    G.still(TL.wobble + 1.9, TL.wobble + 5.5); G.still(TL.realize + 5.3, TL.snap + 1 / 12); G.still(TL.star + 4.5, TL.black);
    for (const c of [TL.wobble + 3.4, TL.realize + 3.3, TL.realize + 4.95, TL.black]) film.cut(c);
    film.coverAt(TL.pin + 3.6);

  },
});
