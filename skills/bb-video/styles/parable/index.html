<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>__TITLE__</title>
<!-- Fonts: Space Mono (the small caps labels, counters) + Noto Sans SC for Chinese. three.js loads from jsDelivr (import map); time is driven by our clock -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/900.css">
<style>html,body{margin:0;background:#000}#stage{position:relative;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script src="lib/core.js"></script>
<script src="lib/promo.js"></script>
<script src="lib/parable.js"></script>
</head><body><div id="stage"></div><script>
// __TITLE__ · 3D stick-figure parable (3D 火柴人寓言), wordless, on the music. Read the skill's styles/parable/STYLE.md first.
// One contrast, one red symbol, one fixed wide shot: setup → divergence → reveal → hold, 15–45 s. Every on-screen word is traceable to brief.md.
// Below: a skeleton with placeholders — two figures and one growing stack. Replace the labels, the prop, the red symbol and the beats with the film's own.
PROMO.compose({
  bpm: 110, offset: 0, duration: 24, grain: false,
  theme: { bg: '#000', fg: '#F2F2F0', ink: '#F2F2F0', muted: '#8C8C88', accent: '#E3262B', paper: '#000', fonts: { display: '"Noto Sans SC", sans-serif', sans: '"Space Mono", "Noto Sans SC", monospace' } },
  build: async (F) => {
    const P = await PROMO.parable(F, { palette: 'void', box: { y1: 4.3 } });   // headroom for a figure standing on its stack, with its label
    // the beats (music sections follow them: styles/parable/score.js)
    F.section(0, 0, { name: 'setup' }); F.section(2.5, 1, { name: 'divergence' }); F.section(15, 2, { name: 'reveal', hit: true }); F.section(18.5, 0, { name: 'hold' });
    // two figures side by side, each with its small caps label (keep both labels the same size and height family)
    const a = P.figure('a', { x: -1.1, z: 0.2, face: 'right', label: '标签 A' });
    const b = P.figure('b', { x: 0.9, z: -0.44, face: 'camera', label: '标签 B', labelOpt: { follow: true, y: 2.05 } });
    // b's prop grows over time: one brick every 0.42 s from 3 s (times are the story; the hands follow them)
    const times = Array.from({ length: 24 }, (_, i) => 3 + i * 0.42), wall = P.wall({ x: 0.9, z: 0, cols: 3, rows: 8, times });
    b.lay(wall, { stance: 'behind' });
    // a waits: sits down, thinks, glances over now and then (a figure that stops still acts)
    const chin = { hL: [0.3, 0.28, -0.12], hR: [0.16, 0.62, 0.04], lean: 0.2, nod: 0.3 };   // seated: chin on a hand (gestures are in the figure's own frame, so a standing 'think' would point at the sky)
    a.sit(1.2, null, { face: 'right' }); a.gesture(2.4, chin, { until: 6.2 }); a.look(6.6, b, { until: 8.2 }); a.gesture(9, chin, { until: 13.8 });
    // reveal: b climbs onto what it built and raises the one red thing (here a flag); a stands and looks up
    const top = b.climb(times[times.length - 1] + 0.7, wall);
    const flag = P.item('flag', { accent: true });
    flag.hold(b, top + 0.2, F.duration, { hand: 'R' }); b.gesture(top + 0.3, { hL: [0, 0.76, -0.17], hR: [0.14, 1.42, 0.3], lean: -0.04, nod: -0.15 }, { until: 19.6 });
    a.pose(15.2, 'stand'); a.look(15.6, b, { until: 18.4 }); a.pose(18.8, 'slump');
    // one closing line, then hold and fade
    P.title('一句话', 18.8, 23.2, { sub: 'ONE LINE' });
    P.fade(22.6, 1.3);
    P.cover(18.6);
    P.run();
  },
});
</script></body></html>
